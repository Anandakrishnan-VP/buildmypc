<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#050508" stroke="url(#cpuGrad)" stroke-width="2" />

  <!-- Gold Socket Pins -->
  <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round">
    <line x1="16" y1="8" x2="16" y2="4" />
    <line x1="24" y1="8" x2="24" y2="4" />
    <line x1="32" y1="8" x2="32" y2="4" />
    <line x1="40" y1="8" x2="40" y2="4" />
    <line x1="48" y1="8" x2="48" y2="4" />

    <line x1="16" y1="56" x2="16" y2="60" />
    <line x1="24" y1="56" x2="24" y2="60" />
    <line x1="32" y1="56" x2="32" y2="60" />
    <line x1="40" y1="56" x2="40" y2="60" />
    <line x1="48" y1="56" x2="48" y2="60" />

    <line x1="8" y1="16" x2="4" y2="16" />
    <line x1="8" y1="24" x2="4" y2="24" />
    <line x1="8" y1="32" x2="4" y2="32" />
    <line x1="8" y1="40" x2="4" y2="40" />
    <line x1="8" y1="48" x2="4" y2="48" />

    <line x1="56" y1="16" x2="60" y2="16" />
    <line x1="56" y1="24" x2="60" y2="24" />
    <line x1="56" y1="32" x2="60" y2="32" />
    <line x1="56" y1="40" x2="60" y2="40" />
    <line x1="56" y1="48" x2="60" y2="48" />
  </g>

  <!-- CPU Substrate Body -->
  <rect x="14" y="14" width="36" height="36" rx="8" fill="url(#cpuGrad)" filter="url(#glow)" />

  <!-- Inner Die Heatspreader -->
  <rect x="22" y="22" width="20" height="20" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5" />
  <rect x="27" y="27" width="10" height="10" rx="2" fill="#00f0ff" />
</svg>